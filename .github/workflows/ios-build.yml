# Compiles the iOS app on a GitHub-hosted Mac, so the team can check iOS builds without owning a Mac.
# It only builds for the simulator with signing off: it proves the code compiles, it does not run on a phone.
name: iOS build

on:
  # Branches with a pull request build through pull_request; pushes build only on main,
  # so one push never starts two macOS runs.
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate the Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen

      - name: Build for the iOS Simulator (no signing)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project PurrSense.xcodeproj \
            -scheme PurrSense \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log | grep -E 'error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)' || true
          grep -q 'BUILD SUCCEEDED' build.log

      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios/build.log
          if-no-files-found: ignore
